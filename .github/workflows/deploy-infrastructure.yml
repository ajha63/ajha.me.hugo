name: Deploy AWS infrastructure

on:
  pull_request:
    branches:
      - main
    paths:
      - infra/cdk/**
      - .github/workflows/deploy-infrastructure.yml
  push:
    branches:
      - main
    paths:
      - infra/cdk/**
      - .github/workflows/deploy-infrastructure.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ajha-me-infrastructure-prod
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "554982632606"
  AWS_REGION: us-east-1
  CDK_STACK_NAME: AjhaMeStack

jobs:
  validate:
    name: Test and synthesize CDK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: infra/cdk/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements-dev.txt
          npm ci

      - name: Run unit tests
        run: python -m pytest

      - name: Synthesize CloudFormation
        run: npx cdk synth "${CDK_STACK_NAME}" --quiet

  deploy:
    name: Deploy production infrastructure
    needs: validate
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    environment:
      name: prod
      url: https://ajha.me/
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: infra/cdk/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements.txt
          npm ci

      - name: Validate deployment role
        env:
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
        run: |
          set -euo pipefail
          if [[ -z "${AWS_ROLE_TO_ASSUME}" ]]; then
            echo "::error::Missing prod environment variable AWS_ROLE_TO_ASSUME"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          role-session-name: ajha-me-infra-${{ github.run_id }}

      - name: Preview changes
        run: npx cdk diff "${CDK_STACK_NAME}"

      - name: Deploy stack
        run: |
          npx cdk deploy "${CDK_STACK_NAME}" \
            --require-approval never \
            --outputs-file cdk-outputs.json
